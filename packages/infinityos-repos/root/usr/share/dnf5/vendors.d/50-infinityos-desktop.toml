version = "1.1"

# InfinityOS publishes patched builds of these Fedora desktop packages.
[[outgoing_packages]]
filters = [
    { filter = "name", comparator = "REGEX", value = "^(gamescope|nautilus(-extensions|-devel)?)$" },
]

[[incoming_packages]]
filters = [
    { filter = "name", comparator = "REGEX", value = "^(gamescope|nautilus(-extensions|-devel)?)$" },
    { filter = "repoid", value = "infinityos" },
]
