name: Build test Infinity Terminal ARM64
on:
  push:
    branches: [codex/terminal-hardware-monitor]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terminal-hardware-arm64
  cancel-in-progress: false
jobs:
  terminal:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Verify source
        run: scripts/test-infinity-delta source
      - uses: docker/setup-buildx-action@v4
      - name: Prepare Ghostty builder
        uses: docker/build-push-action@v7
        with:
          context: ghostty
          file: ghostty/Dockerfile
          load: true
          tags: infinityos-ghostty-builder:ci
          platforms: linux/arm64
          cache-from: type=gha,scope=ghostty-builder-aarch64
          cache-to: type=gha,mode=max,scope=ghostty-builder-aarch64
      - name: Identify renderer cache
        id: renderer
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' infinityos-ghostty-builder:ci)
          key=$(python3 ghostty/cache-key.py "$image_id" 'linux/arm64')
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: .build/ghostty-cache
          key: ghostty-aarch64-${{ steps.renderer.outputs.key }}
      - name: Build RPM
        run: |
          release=$((10000000 + GITHUB_RUN_NUMBER))
          # Ghostty's Docker stage writes root-owned files into the checkout.
          sudo env INFINITY_GHOSTTY_BUILDER_IMAGE=infinityos-ghostty-builder:ci \
            INFINITY_TARGET_PLATFORM='linux/arm64' \
            INFINITY_PACKAGE_RELEASE="$release" packages/build-rpm.sh infinity-terminal
          sudo chown -R "$(id -u):$(id -g)" .build/rpm-output .build/ghostty-cache
      - uses: actions/upload-artifact@v6
        with:
          name: rpm-infinity-terminal-aarch64
          path: .build/rpm-output/*.rpm
          if-no-files-found: error
          retention-days: 7
