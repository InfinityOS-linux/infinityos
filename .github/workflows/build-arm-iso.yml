name: Build verified InfinityOS ISOs
on:
  push:
    branches: [build/reviewed-iso]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: infinityos-reviewed-iso
  cancel-in-progress: false
jobs:
  iso:
    name: Build ISO (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Require signed, tested RPMs from this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-rpm.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=10" --jq '.workflow_runs[0].conclusion // "pending"')
            if [[ "$conclusion" == success ]]; then exit 0; fi
            if [[ "$conclusion" != pending ]]; then echo "RPM publication failed: $conclusion"; exit 1; fi
            sleep 30
          done
          echo 'Timed out waiting for signed RPMs'; exit 1
      - name: Free disposable runner space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Build and verify a fresh Fedora 45 ISO
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo modprobe erofs
          sudo modprobe btrfs
          mkdir -p "$RUNNER_TEMP/iso-output"
          docker run --rm --privileged -e GITHUB_SHA -e TARGET_ARCH \
            -v "$PWD:/work" -v "$RUNNER_TEMP/iso-output:/output" -w /work \
            fedora:45 bash -euo pipefail -c '
              dnf -y install kiwi kiwi-systemdeps distribution-gpg-keys erofs-utils dosfstools xorriso isomd5sum bsdtar git nodejs curl btrfs-progs acl
              test "$(uname -m)" = "$TARGET_ARCH"
              test "$(scripts/infinityos-source-revision)" = "$GITHUB_SHA"
              ./kiwi-build --kiwi-file=InfinityOS.kiwi --image-type=iso --image-profile=Infinity-GNOME-Live --output-dir=/output/infinityos
              images=(/output/infinityos-build/*.iso)
              test "${#images[@]}" = 1
              name="InfinityOS-2.0-Fedora45-GNOME51-${TARGET_ARCH}-${GITHUB_SHA:0:7}-$(date -u +%Y%m%d).iso"
              mv "${images[0]}" "/output/$name"
              cd /output
              sha256sum "$name" > "$name.sha256"
              chmod 644 "$name" "$name.sha256"
            '
      - uses: actions/upload-artifact@v6
        with:
          name: InfinityOS-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/iso-output/*.iso
            ${{ runner.temp }}/iso-output/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: InfinityOS-${{ matrix.arch }}-build-logs
          path: ${{ runner.temp }}/iso-output/infinityos-build/*.log
          if-no-files-found: ignore
          retention-days: 7
