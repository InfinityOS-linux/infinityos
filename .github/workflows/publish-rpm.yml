name: Publish Infinity OS RPM repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityos-rpm-pages
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test source and GNOME extension contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node --test tests/folder-click.test.mjs tests/terminal-resize.test.mjs
          scripts/verify-gnome-extension-contracts

  build-noarch:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-24.04
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        package:
          - infinity-config
          - infinity-setup
          - infinity-updater
          - infinityos-repos
          - infinityos-wallpapers
          - infinityos-ramdrive
          - infinityos-shell-extensions
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM
        run: |
          release=$((10000000 + GITHUB_RUN_NUMBER))
          INFINITY_PACKAGE_RELEASE="$release" packages/build-rpm.sh "${{ matrix.package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.package }}
          path: .build/rpm-output/*.rpm
          if-no-files-found: error
          retention-days: 1

  build-terminal:
    name: Build InfinityTerminal (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM
        run: |
          release=$((10000000 + GITHUB_RUN_NUMBER))
          # Ghostty's Docker stage writes root-owned files into the checkout.
          sudo env INFINITY_TARGET_PLATFORM='${{ matrix.platform }}' \
            INFINITY_PACKAGE_RELEASE="$release" packages/build-rpm.sh infinity-terminal
          sudo chown -R "$(id -u):$(id -g)" .build/rpm-output
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-infinity-terminal-${{ matrix.arch }}
          path: .build/rpm-output/*.rpm
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign RPMs and prepare Pages
    runs-on: ubuntu-24.04
    needs: [build-noarch, build-terminal]
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          merge-multiple: true
          path: .build/rpm-output
      - name: Sign and index both architectures
        env:
          RPM_SIGNING_KEY_B64: ${{ secrets.RPM_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$RPM_SIGNING_KEY_B64"
          signing_key="$RUNNER_TEMP/infinityos-signing.asc"
          printf '%s' "$RPM_SIGNING_KEY_B64" | base64 -d > "$signing_key"
          chmod 600 "$signing_key"
          docker run --rm \
            -v "$PWD:/work" \
            -v "$signing_key:/signing.asc:ro" \
            -w /work fedora:44 sh -ec '
              dnf -qy install createrepo_c rpm-sign gnupg2 python3
              export GNUPGHOME="$(mktemp -d)"
              chmod 700 "$GNUPGHOME"
              gpg --batch --import /signing.asc
              packages/publish-repo.sh .build/rpm-output public
              rm -rf "$GNUPGHOME"
            '
          rm -f "$signing_key"
      - name: Keep previously published release repositories
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/previous-releases"
          import json
          from pathlib import Path
          data = json.loads(Path('releases/stable.json').read_text())
          for version in data['previous']:
              print(version)
          PY
          while IFS= read -r previous; do
            [[ -n "$previous" ]] || continue
            gh release download "repo-$previous" \
              --pattern "rpm-repo-$previous.tar.gz" --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/rpm-repo-$previous.tar.gz" -C public
          done < "$RUNNER_TEMP/previous-releases"
          if [[ -d public/rpm/44/releases/1.0 && $(python3 -c 'import json; print(json.load(open("releases/stable.json"))["version"])') != 1.0 ]]; then
            for arch in aarch64 x86_64; do
              mkdir -p "public/rpm/44/$arch"
              cp -a "public/rpm/44/releases/1.0/$arch/." "public/rpm/44/$arch/"
            done
          fi
      - name: Archive the active signed repository
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("releases/stable.json"))["version"])')
          fedora=$(python3 -c 'import json; print(json.load(open("releases/stable.json"))["fedora_release"])')
          archive="$RUNNER_TEMP/rpm-repo-$version.tar.gz"
          tar -czf "$archive" -C public "rpm/$fedora/releases/$version"
          if ! gh release view "repo-$version" >/dev/null 2>&1; then
            gh release create "repo-$version" --draft \
              --title "Infinity OS $version RPM archive" --target "$GITHUB_SHA"
          fi
          gh release upload "repo-$version" "$archive" --clobber
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Deploy RPM repository
    runs-on: ubuntu-24.04
    needs: publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
