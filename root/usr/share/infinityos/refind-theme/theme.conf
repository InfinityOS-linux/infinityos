# Rosé Pine for rEFInd, adapted for Infinity OS.
banner infinity-theme/background/solid-main.png
banner_scale fillscreen
icons_dir infinity-theme/icons
selection_big infinity-theme/selection/main-big.png
selection_small infinity-theme/selection/main-small.png
hideui hints,badges
# The manual boot menu contains every supported Infinity OS path. Hide the
# optional tool row, including the unreliable UEFI firmware setup shortcut.
showtools
small_icon_size 32
use_graphics_for linux
